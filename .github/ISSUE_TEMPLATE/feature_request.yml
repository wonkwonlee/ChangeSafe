name: Feature request
description: Suggest a capability or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please check `docs/OSS_ROADMAP.md` first — the phase plan and the
        do-not-build list (§6) may already cover this.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: invariants
    attributes:
      label: Does this require an execution path, auto-approval, or model influence on policy outcomes?
      description: |
        These are permanently out of scope (see `CLAUDE.md` safety
        invariants). If yes, describe the goal instead and we'll look for a
        design that fits.
      options:
        - "No"
        - "Yes / not sure"
    validations:
      required: true
