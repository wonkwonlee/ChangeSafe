name: Publish

# Publishing runs from a published GitHub release, never from a branch push:
# the tag is what names a release, and the same commit CI proved is the one
# that reaches the registry.
# Only a published release. npm's trusted-publishing docs warn that with
# `workflow_dispatch` (and `workflow_call`) the OIDC validation checks the
# *calling* workflow's name rather than the one containing the publish, which
# produces a configuration mismatch that looks like a credentials problem. To
# retry a failed publish, re-publish the release; see CONTRIBUTING.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required twice over: it is what trusted publishing exchanges for a
      # publish credential, and what lets npm attach provenance recording
      # which workflow, repository, and commit produced each tarball. For a
      # tool whose product is "you can check this yourself", an unverifiable
      # package would be an odd thing to ship.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          # npm's release guidance: never cache the package manager in a
          # release build. What reaches the registry should come from a clean
          # resolve, not from whatever a previous run happened to leave behind.
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global npm@10.9.8
      - name: Assert runtime contract
        run: |
          test "$(node --version | cut -d. -f1)" = "v22"
          test "$(npm --version)" = "10.9.8"
      - run: npm ci

      # Every published package carries the same version and the tag names it.
      # Without this, a forgotten bump publishes the previous version's number
      # against this version's code — and npm versions are immutable, so that
      # is not a mistake anyone can take back.
      #
      # A version that is already on the registry is *skipped*, not refused.
      # Publishing five packages is five separate registry calls, so a failure
      # partway through leaves some of them live — and since the same version
      # from the same tag cannot be overwritten anyway, republishing it is not
      # a thing that can go wrong. Refusing instead would mean a partial
      # publish could only ever be completed by hand, which is how this
      # project lost provenance on v0.3.x.
      - name: Every version matches the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match version $VERSION — bump the packages or fix the tag"
            exit 1
          fi
          for entry in "cli:changesafe" \
                       "core:@changesafe/core" \
                       "domain-network:@changesafe/domain-network" \
                       "domain-terraform:@changesafe/domain-terraform" \
                       "domain-kubernetes:@changesafe/domain-kubernetes"; do
            DIRECTORY="${entry%%:*}"
            NAME="${entry#*:}"
            OWN=$(node -p "require('./packages/$DIRECTORY/package.json').version")
            if [ "$OWN" != "$VERSION" ]; then
              echo "::error::$NAME is $OWN while the release is $VERSION; the workspace publishes as a set"
              exit 1
            fi
          done
          # A version already on the registry fails the run rather than being
          # treated as done: this script has no way to prove that an existing
          # publish came from this workflow rather than a hand-publish or a
          # compromised account, so it refuses instead of silently blessing
          # whatever is already there. The selection lives in a script so it
          # can be tested; see tests/integration/release-publish-selection.test.ts.
          REMAINING=$(./scripts/select-unpublished.sh "$VERSION" \
            @changesafe/core \
            @changesafe/domain-network \
            @changesafe/domain-terraform \
            @changesafe/domain-kubernetes \
            changesafe | tr '\n' ' ')
          echo "will publish: $REMAINING"
          echo "REMAINING=$REMAINING" >> "$GITHUB_ENV"

      # Publishing is the one action that cannot be undone, so the gate runs
      # again here rather than trusting that it ran on the pull request.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build:cli
      # The libraries publish compiled output, and the pack-and-consume test
      # skips itself without a build — a silent skip here would mean nothing
      # checked what the registry is about to receive.
      - run: npm run build:packages
      - name: The shipped bundle matches the source
        run: |
          if ! git diff --quiet -- packages/cli/dist/changesafe.js; then
            echo "::error::packages/cli/dist/changesafe.js is stale; refusing to publish it"
            exit 1
          fi
      - run: npm test

      # What a consumer will actually get: install the tarball somewhere with
      # no workspace, no dependencies, and gate a plan that must be refused.
      # A package that installs but does not evaluate would otherwise be
      # discovered by whoever ran `npx changesafe` first.
      - name: The packed tarball gates a real change
        run: |
          set -euo pipefail
          npm pack -w changesafe --pack-destination "$RUNNER_TEMP"
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          WORKDIR="$RUNNER_TEMP/consumer"
          mkdir -p "$WORKDIR"
          cp packages/domain-terraform/tests/fixtures/destroys-database.tfplan.json "$WORKDIR/plan.json"
          cd "$WORKDIR"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP/changesafe-$VERSION.tgz" --no-audit --no-fund
          set +e
          ./node_modules/.bin/changesafe gate --domain terraform --input plan.json --format json > out.json
          CODE=$?
          set -e
          test "$CODE" -eq 1 || { echo "::error::expected exit 1 (blocked) from the installed binary, got $CODE"; cat out.json || true; exit 1; }
          test "$(node -p "require('./out.json').blocked")" = "true"

      # Trusted publishing needs npm 11.5.1 or later, and everything above
      # deliberately ran on the pinned 10.9.8 — that pin is what makes the
      # gate reproducible, so it is not loosened for the whole job just to
      # reach a publish command. The upgrade happens here, after the last
      # check, and applies only to the publish itself.
      - name: Use an npm that can publish over OIDC
        run: |
          set -euo pipefail
          npm install --global npm@11.5.1
          test "$(npm --version)" = "11.5.1"

      # No token. Each package trusts this repository and this workflow file
      # through npm's trusted publishing, so the credential is a short-lived
      # OIDC token minted per publish and never stored anywhere. `--provenance`
      # is absent on purpose: under trusted publishing npm attaches provenance
      # automatically, and passing the flag would only invite someone to
      # "fix" it by adding a token later.
      #
      # Dependency order, not alphabetical: a domain published before core
      # would be uninstallable for as long as the gap lasted. The CLI bundles
      # everything and depends on none of them at runtime, so it goes last —
      # if an earlier publish fails, the command-line entry point has not yet
      # advertised a release that is only half there.
      - name: Publish
        run: |
          set -euo pipefail
          for package in @changesafe/core @changesafe/domain-network @changesafe/domain-terraform @changesafe/domain-kubernetes changesafe; do
            case " $REMAINING " in
              *" $package "*)
                echo "publishing $package"
                npm publish -w "$package" --access public
                ;;
              *)
                echo "skipping $package (already at this version on the registry)"
                ;;
            esac
          done
