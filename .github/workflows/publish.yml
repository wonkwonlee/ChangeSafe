name: Publish

# Publishing runs from a published GitHub release, never from a branch push:
# the tag is what names a release, and the same commit CI proved is the one
# that reaches the registry.
on:
  release:
    types: [published]
  # Manual re-run for a release whose publish step failed. It still refuses to
  # publish anything whose version does not match the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.1.2"
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance: the registry records which workflow, which repository,
      # and which commit produced the tarball, signed by GitHub's OIDC
      # identity. For a tool whose product is "you can check this yourself",
      # an unverifiable package would be an odd thing to ship.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Pin npm
        run: npm install --global npm@10.9.8
      - name: Assert runtime contract
        run: |
          test "$(node --version | cut -d. -f1)" = "v22"
          test "$(npm --version)" = "10.9.8"
      - run: npm ci

      # Every published package carries the same version and the tag names it.
      # Without this, a forgotten bump publishes the previous version's number
      # against this version's code — and npm versions are immutable, so that
      # is not a mistake anyone can take back.
      - name: Every version matches the tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match version $VERSION — bump the packages or fix the tag"
            exit 1
          fi
          for entry in "cli:changesafe" \
                       "core:@changesafe/core" \
                       "domain-network:@changesafe/domain-network" \
                       "domain-terraform:@changesafe/domain-terraform"; do
            DIRECTORY="${entry%%:*}"
            NAME="${entry#*:}"
            OWN=$(node -p "require('./packages/$DIRECTORY/package.json').version")
            if [ "$OWN" != "$VERSION" ]; then
              echo "::error::$NAME is $OWN while the release is $VERSION; the workspace publishes as a set"
              exit 1
            fi
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "::error::$NAME@$VERSION is already published; npm versions are immutable"
              exit 1
            fi
          done

      # Publishing is the one action that cannot be undone, so the gate runs
      # again here rather than trusting that it ran on the pull request.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build:cli
      # The libraries publish compiled output, and the pack-and-consume test
      # skips itself without a build — a silent skip here would mean nothing
      # checked what the registry is about to receive.
      - run: npm run build:packages
      - name: The shipped bundle matches the source
        run: |
          if ! git diff --quiet -- packages/cli/dist/changesafe.js; then
            echo "::error::packages/cli/dist/changesafe.js is stale; refusing to publish it"
            exit 1
          fi
      - run: npm test

      # What a consumer will actually get: install the tarball somewhere with
      # no workspace, no dependencies, and gate a plan that must be refused.
      # A package that installs but does not evaluate would otherwise be
      # discovered by whoever ran `npx changesafe` first.
      - name: The packed tarball gates a real change
        run: |
          set -euo pipefail
          npm pack -w changesafe --pack-destination "$RUNNER_TEMP"
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          WORKDIR="$RUNNER_TEMP/consumer"
          mkdir -p "$WORKDIR"
          cp packages/domain-terraform/tests/fixtures/destroys-database.tfplan.json "$WORKDIR/plan.json"
          cd "$WORKDIR"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP/changesafe-$VERSION.tgz" --no-audit --no-fund
          set +e
          ./node_modules/.bin/changesafe gate --domain terraform --input plan.json --format json > out.json
          CODE=$?
          set -e
          test "$CODE" -eq 1 || { echo "::error::expected exit 1 (blocked) from the installed binary, got $CODE"; cat out.json || true; exit 1; }
          test "$(node -p "require('./out.json').blocked")" = "true"

      # Dependency order, not alphabetical: a domain published before core
      # would be uninstallable for as long as the gap lasted. The CLI bundles
      # everything and depends on none of them at runtime, so it goes last —
      # if an earlier publish fails, the command-line entry point has not yet
      # advertised a release that is only half there.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for package in @changesafe/core @changesafe/domain-network @changesafe/domain-terraform changesafe; do
            echo "publishing $package"
            npm publish -w "$package" --provenance --access public
          done
