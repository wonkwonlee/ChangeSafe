name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Default tests must never need network access, an API key, or paid credit.
env:
  CI: "true"

jobs:
  gate:
    name: Lint, typecheck, test, build (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin npm
        run: npm install --global npm@10.9.8
      - name: Assert runtime contract
        run: |
          test "$(node --version | cut -d. -f1)" = "v22"
          test "$(npm --version)" = "10.9.8"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Build the CLI first: its shipped-binary test only runs when the
      # bundle exists, and that test is the proof it works outside the
      # workspace.
      - run: npm run build:cli
      # The committed bundle is what the Action executes in other people's CI,
      # so it has to be the reviewed source and not a stale copy of it. The
      # build is deterministic, so a rebuild from this commit must reproduce
      # the committed bytes exactly; if it does not, someone changed the CLI
      # or its dependencies without rebuilding, and the shipped gate no longer
      # matches the code this pull request shows.
      - name: The shipped bundle matches the source
        run: |
          if ! git diff --quiet -- packages/cli/dist/changesafe.js; then
            echo "::error::packages/cli/dist/changesafe.js is stale. Run 'npm run build:cli' and commit the result."
            git diff --stat -- packages/cli/dist/changesafe.js
            exit 1
          fi
      # The libraries ship compiled output, and only a build produces it. The
      # pack-and-consume test skips itself when there is none, so leaving this
      # out would quietly stop testing what an installer actually receives.
      - run: npm run build:packages
      - run: npm test
      - run: npm run build

  e2e:
    name: Playwright critical paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin npm
        run: npm install --global npm@10.9.8
      - name: Assert runtime contract
        run: |
          test "$(node --version | cut -d. -f1)" = "v22"
          test "$(npm --version)" = "10.9.8"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  action-selftest:
    name: The Action's gate path works end to end
    runs-on: ubuntu-latest
    # Deliberately no `npm ci` and no build: a consumer of the Action gets a
    # checkout and the committed bundle, nothing else. Installing here would
    # hide a bundle that only works inside its own workspace — the failure
    # mode that matters most, since it would appear first in someone else's
    # CI rather than ours.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assert runtime contract
        run: test "$(node --version | cut -d. -f1)" = "v22"
      - name: No dependencies are installed
        run: |
          test ! -d node_modules || { echo "::error::node_modules exists; this job must prove the bundle needs none"; exit 1; }
      # Exercise exactly what action.yml runs: gate a plan, render the
      # comment, and assert the exit code and verdict.
      - name: Gate a destructive plan
        run: |
          set +e
          node packages/cli/dist/changesafe.js gate \
            --domain terraform \
            --input packages/domain-terraform/tests/fixtures/protected-and-injected.tfplan.json \
            --context packages/domain-terraform/tests/fixtures/injected-pr-body.txt \
            --format json --receipt receipt.json > result.json
          CODE=$?
          set -e
          test "$CODE" -eq 1 || { echo "expected exit 1 (blocked), got $CODE"; exit 1; }
          test "$(node -e "process.stdout.write(String(require('./result.json').blocked))")" = "true"
          node scripts/format-summary.mjs result.json | tee summary.md
          grep -q "ChangeSafe blocked this change" summary.md
      - name: Verify the receipt it wrote
        run: node packages/cli/dist/changesafe.js verify receipt.json --format json
      - name: Gate a benign plan
        run: |
          node packages/cli/dist/changesafe.js gate \
            --domain terraform \
            --input packages/domain-terraform/tests/fixtures/safe-scale-up.tfplan.json \
            --format json > benign.json
          test "$(node -e "process.stdout.write(String(require('./benign.json').blocked))")" = "false"

  corpus:
    name: Scenario corpus and gallery are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin npm
        run: npm install --global npm@10.9.8
      - name: Assert runtime contract
        run: |
          test "$(node --version | cut -d. -f1)" = "v22"
          test "$(npm --version)" = "10.9.8"
      - run: npm ci
      - run: npm run build:cli
      - name: Every scenario matches its declared expectations
        run: |
          node packages/cli/dist/changesafe.js scenario check --dir scenarios/network --domain network
          node packages/cli/dist/changesafe.js scenario check --dir scenarios/terraform --domain terraform
          node packages/cli/dist/changesafe.js scenario check --dir scenarios/kubernetes --domain kubernetes
      - name: The published gallery describes the corpus that exists
        # A gallery that drifts advertises coverage the suite does not have.
        run: node packages/cli/dist/changesafe.js scenario gallery --check

  kubernetes-safety:
    name: Kubernetes offline and read-only contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin npm
        run: npm install --global npm@10.9.8
      - name: Assert runtime contract
        run: |
          test "$(node --version | cut -d. -f1)" = "v22"
          test "$(npm --version)" = "10.9.8"
      - run: npm ci
      - name: Offline domain and collector contracts
        run: npx vitest run packages/domain-kubernetes packages/kubernetes-collector tests/integration/kubernetes-contracts.test.ts tests/integration/kubernetes-kind.test.ts
      - name: Collector has no mutation or command capability
        run: |
          if grep -RIE '\.(create|replace|patch|delete|deleteCollection|connect|exec|portForward|watch)[A-Z]|node:child_process|kubectl' packages/kubernetes-collector/src; then
            echo "::error::Kubernetes collector contains a prohibited capability"
            exit 1
          fi

  no-secret-leak:
    name: Client bundle budget and security boundaries
    runs-on: ubuntu-latest
    env:
      # A canary, not a credential. Building with a key set means the client
      # bundle is checked for the key's VALUE — the property that actually
      # matters. (Checking for the variable NAME would only find harmless
      # mentions, such as the setup instructions in a scenario fixture note.)
      OPENAI_API_KEY: sk-canary-must-never-reach-the-client-9f3a1c
      # Every provider credential gets its own canary: a leak through one
      # adapter must not be masked by another adapter being unconfigured.
      ANTHROPIC_API_KEY: sk-ant-canary-must-never-reach-the-client-4b7e02
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin npm
        run: npm install --global npm@10.9.8
      - name: Assert runtime contract
        run: |
          test "$(node --version | cut -d. -f1)" = "v22"
          test "$(npm --version)" = "10.9.8"
      - run: npm ci
      - run: npm run build
      - name: Verify public route budgets and client security boundaries
        run: npm run verify:client-bundles
