apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
  labels:
    tier: frontend
    app: web
  annotations:
    example.com/owner: platform
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: registry.example.invalid/web:v2
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 1000
            capabilities:
              add:
                - NET_BIND_SERVICE
      hostNetwork: false
      hostPID: false
      hostIPC: false
      volumes:
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: demo
  labels:
    app: web
spec:
  selector:
    app: web
