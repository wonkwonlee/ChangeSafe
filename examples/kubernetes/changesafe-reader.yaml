apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: changesafe-reader
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: changesafe-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: changesafe-reader
subjects:
  - kind: ServiceAccount
    name: changesafe-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: changesafe-reader
