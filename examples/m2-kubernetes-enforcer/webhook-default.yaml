apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: changesafe-enforcer-default
webhooks:
  - name: default.enforcer.changesafe.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    clientConfig:
      service:
        name: changesafe-enforcer
        namespace: changesafe-system
        path: /validate
        port: 8443
      caBundle: <base64-ca-bundle>
    # Everything NOT in a namespace labeled changesafe.dev/tier: protected
    # routes here instead — mutually exclusive with webhook-protected.yaml's
    # namespaceSelector, so a given object is only ever evaluated by one of
    # the two configurations. See webhook-protected.yaml for why this is
    # namespace-scoped rather than objectSelector-scoped.
    namespaceSelector:
      matchExpressions:
        - key: changesafe.dev/tier
          operator: NotIn
          values: ["protected"]
    rules:
      - apiGroups: ["apps", ""]
        apiVersions: ["v1"]
        # CREATE and UPDATE only, not DELETE: a DELETE AdmissionReview
        # carries the resource in `oldObject`, not `object`, which this
        # verifier does not yet read. Registering DELETE would produce a
        # verdict with no real object check behind it, so it is left
        # unregistered rather than silently mishandled (future
        # enhancement). CREATE carries the new object exactly like UPDATE
        # does, and the verifier already supports it (GrantOperationSchema
        # includes CREATE) — leaving it unregistered let a brand-new
        # protected workload be created with no grant at all (CS-ADV-012).
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "services"]
    failurePolicy: Ignore
