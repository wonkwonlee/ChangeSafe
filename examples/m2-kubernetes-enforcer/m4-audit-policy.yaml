# M4 experiment 03 (docs/M4_EXPERIMENT_03.md): record what the API server
# did with each Deployment write in the two demo namespaces, at the level
# that includes the stored object. Everything else is not recorded, so the
# evidence stays small and contains only fictional demo objects.
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages: ["RequestReceived"]
rules:
  - level: RequestResponse
    resources:
      - group: apps
        # Subresources are separate resource names: a policy that lists only
        # "deployments" does not record writes to deployments/status. The
        # first live run of experiment 09 had that gap. Every kind the
        # webhook and the candidate status guard name is listed with its
        # status subresource, so the three lists can be checked against
        # each other (tests/integration/m4-status-guard.test.ts).
        resources: ["deployments", "deployments/status", "statefulsets", "statefulsets/status", "daemonsets", "daemonsets/status"]
      - group: ""
        resources: ["services", "services/status"]
    namespaces: ["changesafe-protected-demo", "changesafe-default-demo"]
  - level: None
